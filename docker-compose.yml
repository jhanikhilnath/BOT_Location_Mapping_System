services:
  app:
    build: .
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
  db:
    image: postgres:18-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: 'Asia/Kolkata'
      PGTZ: 'Asia/Kolkata'
      LANG: 'en_IN.UTF-8'
      LC_ALL: 'en_IN.UTF-8'
    ports:
      - '${DB_PORT}:${DB_PORT}'
    volumes:
      - ./data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mydb']
      interval: 5s
      timeout: 5s
      retries: 5
